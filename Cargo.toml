[package]
name = "podcli"
version = "0.6.2"
edition = "2021"
authors = ["Lorenzo Carbonell (a.k.a. atareao) <lorenzo.carbonell.cerezo@gmail.com>"]
license = "MIT"
description = "A CLI podcast manager and player written in Rust"
repository = "https://github.com/atareao/podcli-rs"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
termimad = "0.35"
html2md = "0.2"
itertools = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13"
inquire = "0.9"
clap = {version = "4.6", features = ["derive"]}
tokio = { version = "1.54", features = ["full"]}
reqwest = "0.13"
roxmltree = "0.21"
spinners = "4.2"
colored = "3"
# the player
#gstreamer = "0.17.4"
rodio = "0.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time", "env-filter"] }
# glib-sys = "0.15"

[[bin]]
name = "podcli"
path = "src/main.rs"
